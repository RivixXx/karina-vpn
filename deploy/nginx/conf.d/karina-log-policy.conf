# Install in /etc/nginx/conf.d/. This file is valid only in the http context.
# Query strings are deliberately absent from the log format.
log_format karina_safe '$remote_addr - $remote_user [$time_local] '
                       '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                       '"$http_user_agent"';

# Connection links can contain credentials.
map $uri $karina_log_request {
    default                         1;
    ~^/connect(?:/|$)               0;
}
